# Nixpacks konfiguration til Railway
[phases.setup]
nixPkgs = ["nodejs_20"]

[phases.install]
cmds = ["npm ci --include=dev"]

[phases.build]
cmds = ["npx vite build && npx esbuild server/index.ts --bundle --platform=node --format=cjs --packages=external --sourcemap --outfile=dist/server.cjs && cp server/db/schema.sql dist/schema.sql && cp dist/client/index.html dist/index.html"]

[start]
cmd = "npm run start"
